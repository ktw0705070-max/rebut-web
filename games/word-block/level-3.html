<html lang="ko">
<head>
    <link rel="stylesheet" href="../shared/myeongjo-font.css?v=20261020-myeongjo-trial" />

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>REBOOT Restore Memory — 레벨 3</title>
  <style>
    @font-face {
      font-family: "Gmarket Sans";
      src: url("../shared/assets/fonts/GmarketSansMedium.woff") format("woff");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Gmarket Sans";
      src: url("../shared/assets/fonts/GmarketSansBold.woff") format("woff");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --paper: #fafaf8;
      --ink: #111111;
      --stage-scale: 1;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      user-select: none;
      -webkit-user-select: none;
    }

    body { font-family: "REBUT Myeongjo", "AppleMyungjo", serif; }

    #stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--paper);
      transform: translate(-50%, -50%) scale(var(--stage-scale));
      transform-origin: center;
    }

    .reference {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 1920px;
      height: 1080px;
      display: block;
      pointer-events: none;
    }

    .timer-cover {
      position: absolute;
      z-index: 2;
      left: 835px;
      top: 18px;
      width: 250px;
      height: 62px;
      background: var(--paper);
      pointer-events: none;
    }

    .timer {
      position: absolute;
      z-index: 3;
      top: 25px;
      left: 50%;
      width: 220px;
      height: 44px;
      transform: translateX(-50%);
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.7px;
      text-align: center;
      pointer-events: none;
    }

    .piece {
      position: absolute;
      z-index: 4;
      width: 199px;
      height: 193px;
      cursor: grab;
      touch-action: none;
      transition: left 300ms cubic-bezier(.2, .85, .25, 1.12),
                  top 300ms cubic-bezier(.2, .85, .25, 1.12),
                  transform 170ms ease,
                  filter 130ms ease;
      transform-origin: center;
      will-change: left, top, transform;
    }

    .piece.dragging {
      z-index: 30;
      cursor: grabbing;
      transition: none;
      transform: scale(1.015);
    }

    .piece.placed.slot-su { z-index: 6; }
    .piece.placed.slot-gwan { z-index: 8; }
    .piece.placed.slot-ram { z-index: 10; }
    .piece.placed.slot-seung { z-index: 12; }
    .piece.placed.slot-gaek { z-index: 14; }

    .piece.compact-home:not(.placed) {
      width: 194.383px;
      height: 186.538px;
    }



    /* Exact foreground layer order from the completed Figma node. */
    .figma-overlay {
      position: absolute;
      display: block;
      max-width: none;
      pointer-events: none;
    }

    .static-cube {
      position: absolute;
      width: 199px;
      height: 193px;
      pointer-events: none;
    }

    .fixed-ga {
      z-index: 5;
      left: 644px;
      top: 331px;
      width: 194.383px;
      height: 186.538px;
      overflow: visible;
    }



    /* The fixed 가 block retains its shortened lower face inside its SVG. */




    .fixed-jok { z-index: 7; left: 795px; top: 479px; }
    .figma-mask-lines { z-index: 3; left: 653px; top: 357px; width: 613.5px; height: 612.444px; }
    .figma-ram-edge { z-index: 3; left: 1121px; top: 656px; width: 141.308px; height: 2.201px; }

    .piece.wrong {
      filter: invert(1);
      animation: wrong-shake 360ms ease-in-out;
    }

    .piece.complete { animation: complete-bounce 540ms cubic-bezier(.2, .85, .25, 1.18) both; }







    .cube-outline {
      position: absolute;
      left: 6.8px;
      top: 6.1px;
      width: 181.745px;
      height: 180.832px;
      pointer-events: none;
      filter: drop-shadow(3px 5px 4px rgba(0, 0, 0, 0.16));
    }

    .cube-letter {
      position: absolute;
      /* Center the visible glyph, excluding transparent PNG padding and side faces. */
      left: calc(78.49694px - var(--letter-center-x));
      top: calc(77.79694px - var(--letter-center-y));
      width: 107px;
      height: 108px;
      object-fit: contain;
      pointer-events: none;
    }


    #piece-ram { --letter-center-x: 56px; --letter-center-y: 56px; }
    #piece-gwan { --letter-center-x: 54px; --letter-center-y: 55px; }
    #piece-seung { --letter-center-x: 53.5px; --letter-center-y: 56.5px; }
    #piece-su { --letter-center-x: 53.5px; --letter-center-y: 57.5px; }
    #piece-gaek { --letter-center-x: 52px; --letter-center-y: 56px; }
    #piece-byeol { --letter-center-x: 52.5px; --letter-center-y: 55.5px; }
    .fixed-ga { --letter-center-x: 47.5px; --letter-center-y: 48.5px; }
    .fixed-jok { --letter-center-x: 53.5px; --letter-center-y: 58px; }

    #piece-ram { left: 360px; top: 222px; }
    #piece-gwan { left: 360px; top: 369px; }
    #piece-seung { left: 360px; top: 516px; }
    #piece-su { left: 210px; top: 760px; }
    #piece-gaek { left: 369px; top: 760px; }
    #piece-byeol { left: 525px; top: 760px; }

    .message {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 106px;
      min-height: 32px;
      margin: 0;
      transform: translateX(-50%);
      color: var(--ink);
      font-size: 25px;
      font-weight: 500;
      letter-spacing: -0.55px;
      text-align: center;
      opacity: 0;
      transition: opacity 160ms ease;
      pointer-events: none;
    }

    .message.visible { opacity: 1; }

    .receipt-layer {
      position: absolute;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(249, 249, 251, 0.93);
      opacity: 0;
      visibility: hidden;
      transition: opacity 260ms ease;
    }

    .receipt-layer.visible {
      opacity: 1;
      visibility: visible;
    }

    .receipt {
      width: 520px;
      padding: 54px 58px 48px;
      border: 2px solid var(--ink);
      background: var(--paper);
    }

    .receipt h1 {
      margin: 0 0 38px;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1px;
      text-align: center;
    }

    .receipt dl {
      display: grid;
      grid-template-columns: 130px 1fr;
      row-gap: 17px;
      margin: 0;
      font-size: 21px;
      line-height: 1.45;
    }

    .receipt dt,
    .receipt dd { margin: 0; }
    .receipt dd { font-weight: 700; }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-13px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-9px); }
      80% { transform: translateX(7px); }
    }

    @keyframes complete-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      48% { transform: translateY(-17px) scale(1.045); }
    }

    @media (prefers-reduced-motion: reduce) {
      .piece,
      .message,
      .receipt-layer { transition: none; }
      .piece.wrong,
      .piece.complete { animation: none; }
    }
  </style>

<style data-shared-chrome-reset>
  :root { --paper: #fafaf8 !important; }
  html, body { background: #b9b9b9 !important; }
  #stage { background: var(--paper) !important; }
  .header, .instruction { visibility: hidden !important; }
  #receiptLayer { display: none !important; }

  #stage::before {
    content: "";
    position: absolute;
    z-index: 3;
    top: 0;
    left: 0;
    width: 1920px;
    height: 210px;
    background: var(--paper);
    pointer-events: none;
  }
  .timer-cover, .timer { display: none !important; }

    <p class="message" id="message" role="status" aria-live="polite"></p>

    <section class="receipt-layer" id="receiptLayer" aria-hidden="true">
      <article class="receipt" aria-labelledby="receiptTitle">
        <h1 id="receiptTitle">복원 완료</h1>
        <dl>
          <dt>완성 단어</dt><dd>가수 · 수족관 · 관람객 · 승객</dd>
          <dt>소요 시간</dt><dd id="resultTime">0:00</dd>
          <dt>점수</dt><dd id="resultScore">100</dd>
        </dl>
      </article>
    </section>

  <script>
    (() => {
      "use strict";

      const WIDTH = 1920;
      const HEIGHT = 1080;
      const SLOT_POSITIONS = {
        su: { x: 793, y: 332, centerX: 892.5, centerY: 428.5 },
        gwan: { x: 796, y: 626, centerX: 895.5, centerY: 722.5 },
        ram: { x: 944, y: 626, centerX: 1043.5, centerY: 722.5 },
        seung: { x: 1091, y: 478, centerX: 1190.5, centerY: 574.5 },
        gaek: { x: 1091, y: 626, centerX: 1190.5, centerY: 722.5 }
      };
      const ANSWER = { su: "수", gwan: "관", ram: "람", seung: "승", gaek: "객" };

      const stage = document.querySelector("#stage");
      const pieces = [...document.querySelectorAll(".piece")];
      const timerElement = document.querySelector("#timer");
      const messageElement = document.querySelector("#message");
      const receiptLayer = document.querySelector("#receiptLayer");
      const resultTime = document.querySelector("#resultTime");
      const resultScore = document.querySelector("#resultScore");
      const slots = new Map(Object.keys(SLOT_POSITIONS).map((key) => [key, null]));

      let activePiece = null;
      let pointerOffset = { x: 0, y: 0 };
      let elapsedSeconds = 0;
      let startedAt = (window.RebutGameClock?.now() ?? performance.now());
      let finished = false;
      let checking = false;
      let retryCount = 0;
      let placementAttempts = 0;
      let correctPlacements = 0;
      let messageTimer = 0;

      function fitStage() {
        const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
        document.documentElement.style.setProperty("--stage-scale", String(scale));
      }

      function stagePoint(event) {
        const rect = stage.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (WIDTH / rect.width),
          y: (event.clientY - rect.top) * (HEIGHT / rect.height)
        };
      }

      function pxValue(piece, property) {
        return Number.parseFloat(getComputedStyle(piece)[property]);
      }

      function showMessage(text, duration = 1500) {
        (window.RebutGameClock || window).clearTimeout(messageTimer);
        messageElement.textContent = text;
        messageElement.classList.add("visible");
        if (duration > 0) {
          messageTimer = (window.RebutGameClock || window).setTimeout(() => messageElement.classList.remove("visible"), duration);
        }
      }

      function clearSlot(piece) {
        const slotKey = piece.dataset.slot;
        if (slotKey && slots.get(slotKey) === piece) slots.set(slotKey, null);
        delete piece.dataset.slot;
        piece.classList.remove("placed", "slot-su", "slot-gwan", "slot-ram", "slot-seung", "slot-gaek");
      }

      function sendHome(piece) {
        clearSlot(piece);
        piece.style.left = `${piece.dataset.homeX}px`;
        piece.style.top = `${piece.dataset.homeY}px`;
      }

      function nearestSlot(piece) {
        const centerX = pxValue(piece, "left") + piece.offsetWidth / 2;
        const centerY = pxValue(piece, "top") + piece.offsetHeight / 2;
        let nearest = null;
        let nearestDistance = 125;
        Object.entries(SLOT_POSITIONS).forEach(([key, slot]) => {
          if (slots.get(key) && slots.get(key) !== piece) return;
          const distance = Math.hypot(centerX - slot.centerX, centerY - slot.centerY);
          if (distance < nearestDistance) {
            nearestDistance = distance;
            nearest = key;
          }
        });
        return nearest;
      }

      function snapToSlot(piece, slotKey) {
        placementAttempts += 1;
        if (piece.dataset.char === ANSWER[slotKey]) correctPlacements += 1;
        clearSlot(piece);
        const position = SLOT_POSITIONS[slotKey];
        slots.set(slotKey, piece);
        piece.dataset.slot = slotKey;
        piece.classList.add("placed", `slot-${slotKey}`);
        piece.style.left = `${position.x}px`;
        piece.style.top = `${position.y}px`;
        (window.RebutGameClock || window).setTimeout(checkAnswer, 340);
      }

      function checkAnswer() {
        if (finished || checking || [...slots.values()].some((piece) => !piece)) return;
        checking = true;
        const wrong = [...slots.entries()].filter(([key, piece]) => piece.dataset.char !== ANSWER[key]);
        if (wrong.length) {
          retryCount += 1;
          showMessage("글자가 맞물리지 않습니다.", 1600);
          wrong.forEach(([, piece]) => piece.classList.add("wrong"));
          (window.RebutGameClock || window).setTimeout(() => {
            wrong.forEach(([, piece]) => {
              piece.classList.remove("wrong");
              sendHome(piece);
            });
            checking = false;
          }, 760);
          return;
        }
        completeLevel();
      }

      function completeLevel() {
        window.parent.postMessage({
          type: "rebut-level-complete",
          level: 3,
          elapsedSeconds,
          retryCount,
          placementAttempts,
          correctPlacements
        }, "*");
        finished = true;
        checking = false;
        showMessage("", 0);
        ["su", "seung", "gwan", "ram", "gaek"].forEach((key, index) => {
          (window.RebutGameClock || window).setTimeout(() => slots.get(key).classList.add("complete"), index * 105);
        });
        (window.RebutGameClock || window).setTimeout(() => {
          resultTime.textContent = formatTime(elapsedSeconds);
          resultScore.textContent = "100";
          receiptLayer.classList.add("visible");
          receiptLayer.setAttribute("aria-hidden", "false");
          window.parent.postMessage({ type: "rebut-level-complete", level: 3 }, "*");
        }, 1250);
      }

      function onPointerDown(event) {
        if (finished || checking) return;
        const piece = event.currentTarget;
        if (piece.dataset.slot) {
          sendHome(piece);
          return;
        }
        const point = stagePoint(event);
        activePiece = piece;
        pointerOffset = { x: point.x - pxValue(piece, "left"), y: point.y - pxValue(piece, "top") };
        piece.classList.add("dragging");
        piece.setPointerCapture?.(event.pointerId);
        event.preventDefault();
      }

      function onPointerMove(event) {
        if (!activePiece) return;
        const point = stagePoint(event);
        activePiece.style.left = `${point.x - pointerOffset.x}px`;
        activePiece.style.top = `${point.y - pointerOffset.y}px`;
        event.preventDefault();
      }

      function onPointerUp(event) {
        if (!activePiece) return;
        const piece = activePiece;
        activePiece = null;
        piece.classList.remove("dragging");
        piece.releasePointerCapture?.(event.pointerId);
        const slotKey = nearestSlot(piece);
        if (slotKey) snapToSlot(piece, slotKey);
        else sendHome(piece);
      }

      function formatTime(seconds) {
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function tick(now) {
        if (!finished) {
          const next = Math.floor((now - startedAt) / 1000);
          if (next !== elapsedSeconds) {
            elapsedSeconds = next;
            timerElement.textContent = formatTime(elapsedSeconds);
            timerElement.setAttribute("datetime", `PT${elapsedSeconds}S`);
          }
        }
        (window.RebutGameClock || globalThis).requestAnimationFrame(tick);
      }

      pieces.forEach((piece) => piece.addEventListener("pointerdown", onPointerDown));
      window.addEventListener("pointermove", onPointerMove, { passive: false });
      window.addEventListener("pointerup", onPointerUp, { passive: false });
      window.addEventListener("pointercancel", onPointerUp, { passive: false });
      fitStage();
      window.addEventListener("resize", fitStage);
      (window.RebutGameClock || globalThis).requestAnimationFrame(tick);
    })();
  </script>

<script>
(() => {
  const receipt = document.querySelector("#receiptLayer");
  if (!receipt) return;
  let sent = false;
  const notify = () => {
    if (sent || !receipt.classList.contains("visible")) return;
    sent = true;
    window.parent.postMessage({ type: "rebut-level-complete", level: 3 }, "*");
  };
  new MutationObserver(notify).observe(receipt, { attributes: true, attributeFilter: ["class"] });
  notify();
})();
</script>
