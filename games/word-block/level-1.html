      opacity: 1;
      visibility: visible;
    }

    .target.solution-hidden,
    .piece.solution-hidden {
      visibility: hidden;
    }

    .piece {
      position: absolute;
      z-index: 4;
      display: block;
      object-fit: fill;
      cursor: grab;
      touch-action: none;
      -webkit-user-drag: none;
      transition: left 300ms cubic-bezier(.2, .85, .25, 1.12),
                  top 300ms cubic-bezier(.2, .85, .25, 1.12),
                  transform 170ms ease,
                  filter 130ms ease;
      transform-origin: center;
      will-change: left, top, transform;
    }

    .piece.dragging {
      z-index: 8;
      cursor: grabbing;
      transition: none;
      transform: scale(1.015);
    }

    .piece.placed {
      z-index: 6;
    }

    .piece.bottom-inserted {
      z-index: 7;
    }

    .piece.fitted {
      clip-path: none;
    }

    .asset-preload {
      display: none;
    }

    .piece.wrong {
      filter: invert(1);
      animation: wrong-shake 360ms ease-in-out;
    }

    .piece.complete {
      animation: complete-bounce 540ms cubic-bezier(.2, .85, .25, 1.18) both;
    }

      left: 363px;
      top: 317px;
      width: 199.06px;

      letter-spacing: -0.5px;
      opacity: 0;
      transition: opacity 150ms ease;
      pointer-events: none;
    }

    .message.visible {
      opacity: 1;
    }

      position: absolute;
      left: 1736px;
      top: 988px;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--ink);
      opacity: 0.75;
    }

    .receipt-layer {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgb(249 249 251 / 88%);
      opacity: 0;
      visibility: hidden;
      transition: opacity 220ms ease;
    }

    .receipt-layer.visible {
      opacity: 1;
      visibility: visible;
    }

    .receipt {
      width: 480px;
      padding: 43px 48px 40px;
      border: 2px solid var(--ink);
      background: var(--paper);
      text-align: center;
    }

    .receipt h1 {
      margin: 0 0 34px;
      font-size: 31px;
      line-height: 1.25;
      letter-spacing: -0.78px;
    }

    .receipt dl {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px 28px;
      margin: 0;
      padding-top: 25px;
      border-top: 1px solid var(--ink);
      font-size: 20px;
      line-height: 1.3;
      text-align: left;
    }

    .receipt dt,
    .receipt dd {
      margin: 0;
    }

    .receipt dd {
      font-weight: 700;
      text-align: right;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-13px); }
      40% { transform: translateX(12px); }
      60% { transform: translateX(-9px); }
      80% { transform: translateX(7px); }
    }

    @keyframes complete-bounce {
      0%, 100% { transform: translateY(0) scale(1); }
      48% { transform: translateY(-17px) scale(1.045); }
    }

    <span class="canvas-dot" aria-hidden="true"></span>

    <section class="receipt-layer" id="receiptLayer" aria-hidden="true">
      <article class="receipt" aria-labelledby="receiptTitle">
        <h1 id="receiptTitle">복원 완료</h1>
        <dl>
          <dt>완성 단어</dt>
          <dd>사과 · 과일</dd>
          <dt>소요 시간</dt>
          <dd id="resultTime">0:00</dd>
          <dt>점수</dt>
          <dd id="resultScore">1000</dd>
        </dl>
      </article>
    </section>

    <p class="sr-only">글자 블록을 끌어 빈 슬롯에 놓으세요. 놓인 블록을 누르면 원래 자리로 돌아갑니다.</p>
  </main>

  <script>
    (() => {
      "use strict";

      const WIDTH = 1920;
      const HEIGHT = 1080;
      const SLOT_POSITIONS = {
        "0,1": { x: 933, y: 411, centerX: 1013, centerY: 495 },
        "1,1": { x: 933, y: 557, centerX: 1013, centerY: 644 }
      };
      const ANSWER = { "0,1": "과", "1,1": "일" };

      const stage = document.querySelector("#stage");
      const pieces = [...document.querySelectorAll(".piece")];
      const targetElement = document.querySelector(".target");
      const finalGroupElement = document.querySelector("#finalGroup");
      const topSlotFrameLineElement = document.querySelector("#topSlotFrameLine");
      const topSlotOccluderElement = document.querySelector("#topSlotOccluder");
      const bottomSlotElements = [
        document.querySelector("#bottomSlotRightOccluder"),
        document.querySelector("#bottomSlotBottomOccluder"),
        document.querySelector("#bottomSlotFrameLine"),
        document.querySelector("#bottomSlotLineGray"),
        document.querySelector("#bottomSlotLineBlack")
      ];
      const ilFittedAsset = document.querySelector("#ilFittedAsset");
      const timerElement = document.querySelector("#timer");
      const messageElement = document.querySelector("#message");
      const receiptLayer = document.querySelector("#receiptLayer");
      const resultTime = document.querySelector("#resultTime");
      const resultScore = document.querySelector("#resultScore");

      const slots = new Map(Object.keys(SLOT_POSITIONS).map((key) => [key, null]));
      const looseSources = new Map(pieces.map((piece) => [piece, piece.src]));
      let activePiece = null;
      let pointerOffset = { x: 0, y: 0 };
      let elapsedSeconds = 0;
      let startedAt = (window.RebutGameClock?.now() ?? performance.now());
      let finished = false;
      let checking = false;
      let retryCount = 0;
      let placementAttempts = 0;
      let correctPlacements = 0;

      function fitStage() {
        const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
        document.documentElement.style.setProperty("--stage-scale", String(scale));
      }

      function stagePoint(event) {
        const rect = stage.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (WIDTH / rect.width),
          y: (event.clientY - rect.top) * (HEIGHT / rect.height)
        };
      }

      function pxValue(piece, property) {
        return Number.parseFloat(getComputedStyle(piece)[property]);
      }

      function restoreLooseAppearance(piece) {
        const source = looseSources.get(piece);
        if (source && piece.src !== source) piece.src = source;
        piece.classList.remove("fitted", "top-inserted", "bottom-inserted");
        piece.style.removeProperty("width");
        piece.style.removeProperty("height");
      }

      function applyFittedAppearance(piece, slotKey) {
        if (slotKey === "0,1") {
          piece.classList.add("top-inserted");
        } else if (slotKey === "1,1") {
          piece.classList.add("bottom-inserted");
        }
      }

      function syncTopSlotPresentation() {
        const topPiece = slots.get("0,1");
        const topVisible = !finished && Boolean(topPiece);
        const bottomVisible = !finished && Boolean(slots.get("1,1"));
        topSlotFrameLineElement.classList.toggle("visible", topVisible && !bottomVisible);
        topSlotOccluderElement.classList.toggle("visible", topVisible && !bottomVisible);
        bottomSlotElements.forEach((element) => element.classList.toggle("visible", bottomVisible));
        if (!finished) targetElement.classList.remove("solution-hidden");
      }

      function clearSlot(piece) {
        const slotKey = piece.dataset.slot;
        if (slotKey && slots.get(slotKey) === piece) slots.set(slotKey, null);
        delete piece.dataset.slot;
        piece.classList.remove("placed");
        restoreLooseAppearance(piece);
        syncTopSlotPresentation();
      }

      function sendHome(piece, delay = 0) {
        clearSlot(piece);
        (window.RebutGameClock || window).setTimeout(() => {
          piece.style.left = `${piece.dataset.homeX}px`;
          piece.style.top = `${piece.dataset.homeY}px`;
        }, delay);
      }

      function showMessage(text) {
        messageElement.textContent = text;
        messageElement.classList.toggle("visible", Boolean(text));
      }

      function nearestSlot(piece) {
        const faceCenterX = pxValue(piece, "left") + 78;
        const faceCenterY = pxValue(piece, "top") + 78;
        let nearest = null;
        let bestDistance = Infinity;

        Object.entries(SLOT_POSITIONS).forEach(([key, position]) => {
          if (slots.get(key) && slots.get(key) !== piece) return;
          const distance = Math.hypot(faceCenterX - position.centerX, faceCenterY - position.centerY);
          if (distance < bestDistance) {
            bestDistance = distance;
            nearest = key;
          }
        });

        return bestDistance <= 125 ? nearest : null;
      }

      function snapToSlot(piece, slotKey) {
        placementAttempts += 1;
        if (piece.dataset.char === ANSWER[slotKey]) correctPlacements += 1;
        clearSlot(piece);
        const position = SLOT_POSITIONS[slotKey];
        applyFittedAppearance(piece, slotKey);
        slots.set(slotKey, piece);
        piece.dataset.slot = slotKey;
        piece.classList.add("placed");
        piece.style.left = `${position.x}px`;
        piece.style.top = `${position.y}px`;
        syncTopSlotPresentation();
        (window.RebutGameClock || window).setTimeout(checkIfFull, 330);
      }

      function checkIfFull() {
        if (finished || checking || [...slots.values()].some((piece) => !piece)) return;
        checking = true;
        const isCorrect = [...slots.entries()].every(([key, piece]) => piece.dataset.char === ANSWER[key]);
        if (isCorrect) completeLevel();
        else rejectAnswer();
      }

      function rejectAnswer() {
        retryCount += 1;
        showMessage("글자가 맞물리지 않습니다.");
        [...slots.entries()].forEach(([key, piece]) => {
          if (piece.dataset.char !== ANSWER[key]) piece.classList.add("wrong");
        });

        (window.RebutGameClock || window).setTimeout(() => {
          pieces.forEach((piece, index) => {
            piece.classList.remove("wrong");
            sendHome(piece, index * 70);
          });
          checking = false;
        }, 620);

        (window.RebutGameClock || window).setTimeout(() => showMessage(""), 1780);
      }

      function completeLevel() {
        window.parent.postMessage({
          type: "rebut-level-complete",
          level: 1,
          elapsedSeconds,
          retryCount,
          placementAttempts,
          correctPlacements
        }, "*");
        finished = true;
        checking = false;
        showMessage("");

        const topPiece = slots.get("0,1");
        const bottomPiece = slots.get("1,1");
        topPiece.classList.add("complete");
        (window.RebutGameClock || window).setTimeout(() => bottomPiece.classList.add("complete"), 145);

        (window.RebutGameClock || window).setTimeout(() => {
          targetElement.classList.remove("solution-hidden");
          topPiece.classList.remove("solution-hidden");
          bottomPiece.classList.remove("solution-hidden");
          bottomSlotElements.forEach((element) => element.classList.add("visible"));
          finalGroupElement.classList.remove("visible");
        }, 720);

        (window.RebutGameClock || window).setTimeout(() => {
          resultTime.textContent = formatTime(elapsedSeconds);
          resultScore.textContent = String(Math.max(100, 1000 - elapsedSeconds * 10));
          receiptLayer.classList.add("visible");
          receiptLayer.setAttribute("aria-hidden", "false");
          window.parent.postMessage({ type: "rebut-level-complete", level: 1 }, "*");
        }, 2100);
      }

      function onPointerDown(event) {
        if (finished || checking) return;
        const piece = event.currentTarget;
        event.preventDefault();

        if (piece.dataset.slot) {
          sendHome(piece);
          showMessage("");
          return;
        }

        const point = stagePoint(event);
        activePiece = piece;
        pointerOffset = {
          x: point.x - pxValue(piece, "left"),
          y: point.y - pxValue(piece, "top")
        };
        piece.classList.add("dragging");
        piece.setPointerCapture?.(event.pointerId);
      }

      function onPointerMove(event) {
        if (!activePiece) return;
        event.preventDefault();
        const point = stagePoint(event);
        activePiece.style.left = `${point.x - pointerOffset.x}px`;
        activePiece.style.top = `${point.y - pointerOffset.y}px`;
      }

      function onPointerUp(event) {
        if (!activePiece) return;
        event.preventDefault();
        const piece = activePiece;
        activePiece = null;
        piece.classList.remove("dragging");
        piece.releasePointerCapture?.(event.pointerId);

        const slotKey = nearestSlot(piece);
        if (slotKey) snapToSlot(piece, slotKey);
        else sendHome(piece);
      }

      function formatTime(seconds) {
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
      }

      function tick(now) {
        if (!finished) {
          const next = Math.floor((now - startedAt) / 1000);
          if (next !== elapsedSeconds) {
            elapsedSeconds = next;
            timerElement.textContent = formatTime(elapsedSeconds);
            timerElement.setAttribute("datetime", `PT${elapsedSeconds}S`);
          }
        }
        (window.RebutGameClock || globalThis).requestAnimationFrame(tick);
      }

      pieces.forEach((piece) => {
        piece.addEventListener("pointerdown", onPointerDown);
      });
      window.addEventListener("pointermove", onPointerMove, { passive: false });
      window.addEventListener("pointerup", onPointerUp, { passive: false });
      window.addEventListener("pointercancel", onPointerUp, { passive: false });

      fitStage();
      window.addEventListener("resize", fitStage);
      (window.RebutGameClock || globalThis).requestAnimationFrame(tick);
    })();
  </script>

<script>
(() => {
  const receipt = document.querySelector("#receiptLayer");
  if (!receipt) return;
  let sent = false;
  const notify = () => {
    if (sent || !receipt.classList.contains("visible")) return;
    sent = true;
    window.parent.postMessage({ type: "rebut-level-complete", level: 1 }, "*");
  };
  new MutationObserver(notify).observe(receipt, { attributes: true, attributeFilter: ["class"] });
  notify();
})();
</script>
</body>
</html>
