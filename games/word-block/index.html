          <img class="tutorial-occluder tutorial-top-occluder" src="assets/extracted-dcd753bde3e65c9a.svg" alt="" aria-hidden="true" draggable="false" />
          <img class="tutorial-occluder tutorial-bottom-right-occluder" src="assets/extracted-af6777ed1293a521.svg" alt="" aria-hidden="true" draggable="false" />
          <img class="tutorial-occluder tutorial-bottom-bottom-occluder" src="assets/extracted-323e97dfc2a284b6.svg" alt="" aria-hidden="true" draggable="false" />
          <img class="tutorial-occluder tutorial-bottom-frame-line" src="assets/extracted-ad5bede2488b6412.svg" alt="" aria-hidden="true" draggable="false" />
          <img class="tutorial-occluder tutorial-bottom-line-gray" src="assets/extracted-4c172988438eb897.svg" alt="" aria-hidden="true" draggable="false" />
          <img class="tutorial-occluder tutorial-bottom-line-black" src="assets/extracted-5a3f30b88b211b0a.svg" alt="" aria-hidden="true" draggable="false" />
          <img id="tutorial-cursor" class="tutorial-cursor" src="assets/extracted-de70053ebb174a3d.svg" alt="글자 블록을 끌어 놓는 마우스 커서" draggable="false" />
        </div>
        <p id="tutorial-instructions" class="tutorial-instructions">
          <span>먼저, 흩어진 글자 블록을 살펴보세요.</span>
          <span>그다음, 글자를 끌어다 빈칸에 끼우세요.</span>
        </p>
        <button id="tutorial-start" class="tutorial-start" type="button">
          <img src="assets/extracted-16c4212056f15aee.png" alt="" draggable="false" />
          <span>시작하기</span>
        </button>
      </article>
    </div>

  </main>
  <script>window.__WORD_BLOCK_CONFIG__ = {"levelUrls":["./level-1.html","./level-2.html","./level-3.html"],"digitUrls":["assets/extracted-f92c5161d1d6a016.png","assets/extracted-b9406876415e5f8e.png","assets/extracted-ec3d6f7a7fd1dbf0.png"]};</script>
  <script>(() => {
  "use strict";

  const WIDTH = 1920;
  const HEIGHT = 1080;
  const TOP_FIXED_END_Y = 133;
  const RESULT_STORAGE_KEY = "rebut.word-block.result.v1";
  const TIMING = Object.freeze({
    POPUP_FADE_OUT: 300,
    BUTTON_PRESS: 100,
    LEVEL_BACKDROP_LEAD: 200,
    LEVEL_FADE_IN: 600,
    LEVEL_HOLD: 1200,
    LEVEL_FADE_OUT: 800,
    TUTORIAL_PRESENT: 1500,
    CURSOR_MOVE: 500,
    BLOCK_DRAG: 650,
    INSERT_SETTLE: 330,
    COMPLETE_STAGGER: 145,
    COMPLETE_HOLD: 1200,
    LOOP_PAUSE: 900,
    RESET_SETTLE: 80,
    CORRECT_LOGO_WAVE: 1000,
    LOGO_WAVE_LETTER: 660,
    LOGO_WAVE_STAGGER: 85,
  });

  const { levelUrls, digitUrls } = window.__WORD_BLOCK_CONFIG__;
  const query = new URLSearchParams(window.location.search);
  const requestedLevel = Number(query.get("level"));
  const initialLevel = Number.isInteger(requestedLevel) && requestedLevel >= 1 && requestedLevel <= levelUrls.length
    ? requestedLevel - 1
    : 0;
  const app = document.querySelector("#app");
  const frame = document.querySelector("#gameFrame");
  const backButton = document.querySelector("#game-back");
  const utilityControls = document.querySelector(".utility-controls");
  const restartControl = document.querySelector(".restart-control");
  const roundProgress = document.querySelector(".round-progress");
  const gameLogo = document.querySelector(".game-logo");
  const gameLogoLetters = [...gameLogo.querySelectorAll("img")];
  const levelDigit = document.querySelector("#level-progress-digit");
  const overlay = document.querySelector("#tutorial-overlay");
  const startButton = document.querySelector("#tutorial-start");
  const demo = document.querySelector(".tutorial-demo");
  const cursor = document.querySelector("#tutorial-cursor");
  const gwa = document.querySelector("#tutorial-gwa");
  const il = document.querySelector("#tutorial-il");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  let currentLevel = 0;
  let transitionScheduled = false;
  let tutorialRun = 0;
  const roundResults = [];
  const prefetchedLevels = new Set();

  const sleep = (duration) => new Promise((resolve) => (window.RebutGameClock || window).setTimeout(resolve, duration));
  const motionDelay = (duration) => reduceMotion.matches ? Math.min(duration, 40) : duration;

  document.documentElement.style.setProperty(
    "--logo-wave-letter-duration",
    `${TIMING.LOGO_WAVE_LETTER}ms`,
  );
  gameLogoLetters.forEach((letter, index) => {
    letter.style.setProperty(
      "--logo-wave-delay",
      `${index * TIMING.LOGO_WAVE_STAGGER}ms`,
    );
  });

  function fitApp() {
    const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
    const verticalExtra = Math.max(0, window.innerHeight / scale - HEIGHT);

    document.documentElement.style.setProperty("--app-scale", String(scale));
    app.style.height = HEIGHT + verticalExtra + "px";
    app.style.setProperty("--popup-top", 103.5 + verticalExtra * 0.5 + "px");
    [
      { element: utilityControls, y: 151 },
      { element: backButton, y: 977.87 },
      { element: restartControl, y: 253.6 },
    ].forEach(({ element, y }) => {
      const progress = Math.min(1, Math.max(0, (y - TOP_FIXED_END_Y) / (HEIGHT - TOP_FIXED_END_Y)));
      element.style.setProperty("--responsive-y", verticalExtra * progress + "px");
    });
  }

  function updateChrome() {
    levelDigit.src = digitUrls[currentLevel];
    levelDigit.alt = String(currentLevel + 1);
    roundProgress.setAttribute("aria-label", "현재 진행 " + (currentLevel + 1) + "-1");
  }

  function loadLevel(index) {
    currentLevel = Math.max(0, Math.min(levelUrls.length - 1, index));
    transitionScheduled = false;
    roundResults[currentLevel] = undefined;
    frame.title = "REBOOT Restore Memory 레벨 " + (currentLevel + 1);
    frame.src = levelUrls[currentLevel];
    updateChrome();
    // The next board is small now; warm it while this board is being played.
    const next = levelUrls[currentLevel + 1];
    if (next && !navigator.connection?.saveData && !prefetchedLevels.has(next)) {
      prefetchedLevels.add(next);
      const hint = document.createElement("link");
      hint.rel = "prefetch";
      hint.as = "document";
      hint.href = next;
      document.head.append(hint);
    }
  }

  async function playCorrectLogoWave() {
    gameLogo.classList.remove("is-waving");
    void gameLogo.offsetWidth;
    gameLogo.classList.add("is-waving");
    await sleep(motionDelay(TIMING.CORRECT_LOGO_WAVE));
    gameLogo.classList.remove("is-waving");
  }

  function recordRoundResult(data) {
    const index = Number(data.level) - 1;
    roundResults[index] = {
      elapsedSeconds: Math.max(0, Number(data.elapsedSeconds) || 0),
      retryCount: Math.max(0, Math.round(Number(data.retryCount) || 0)),
      placementAttempts: Math.max(0, Math.round(Number(data.placementAttempts) || 0)),
      correctPlacements: Math.max(0, Math.round(Number(data.correctPlacements) || 0)),
    };
  }

  function saveFinalResult() {
    const playedRounds = roundResults.filter(Boolean);
    const totals = playedRounds.reduce((sum, result) => ({
      elapsedSeconds: sum.elapsedSeconds + result.elapsedSeconds,
      retryCount: sum.retryCount + result.retryCount,
      placementAttempts: sum.placementAttempts + result.placementAttempts,
      correctPlacements: sum.correctPlacements + result.correctPlacements,
    }), { elapsedSeconds: 0, retryCount: 0, placementAttempts: 0, correctPlacements: 0 });

    const accuracy = totals.placementAttempts > 0
      ? Math.round((totals.correctPlacements / totals.placementAttempts) * 100)
      : 0;
    const result = {
      accuracy: Math.min(100, Math.max(0, accuracy)),
      time: totals.elapsedSeconds,
      retry: totals.retryCount,
    };

    try {
      sessionStorage.setItem(RESULT_STORAGE_KEY, JSON.stringify(result));
    } catch {
      // 저장소가 막힌 환경에서는 결과 페이지의 예시 값으로 안전하게 표시합니다.
    }
  }

  async function scheduleNext(data) {
    const completedLevel = Number(data.level);
    if (completedLevel !== currentLevel + 1) return;
    if (transitionScheduled) return;
    transitionScheduled = true;
    recordRoundResult(data);
    if (currentLevel >= levelUrls.length - 1) saveFinalResult();
    await playCorrectLogoWave();
    if (currentLevel >= levelUrls.length - 1) {
      window.location.href = "./result.html";
      return;
    }
    const nextLevel = currentLevel + 2;
    await showLevelTransition(nextLevel);
    loadLevel(nextLevel - 1);
  }

  function resetDemo(instant = true) {
    gwa.classList.remove("is-dragging", "is-complete", "is-bouncing");
    il.classList.remove("is-dragging", "is-complete", "is-bouncing");
    demo.classList.remove("has-top-piece", "has-bottom-piece", "is-complete");
    if (instant) {
      gwa.style.transition = "none";
      il.style.transition = "none";
    }
    gwa.style.left = "91.796px";
    gwa.style.top = "290.405px";
    il.style.left = "91.796px";
    il.style.top = "363.66px";
    cursor.style.setProperty("--cursor-duration", "0ms");
    cursor.style.setProperty("--cursor-x", "0px");
    cursor.style.setProperty("--cursor-y", "0px");
    cursor.classList.remove("is-clicking");
    if (instant) {
      void gwa.offsetWidth;
      gwa.style.removeProperty("transition");
      il.style.removeProperty("transition");
    }
  }

  async function moveCursor(x, y, duration) {
    cursor.style.setProperty("--cursor-duration", duration + "ms");
    cursor.style.setProperty("--cursor-x", x - 183 + "px");
    cursor.style.setProperty("--cursor-y", y - 378 + "px");
    await sleep(duration);
  }

  async function pressCursor() {
    cursor.classList.add("is-clicking");
    await sleep(TIMING.BUTTON_PRESS);
    cursor.classList.remove("is-clicking");
  }

  async function dragBlock(piece, left, top, cursorX, cursorY) {
    await pressCursor();
    piece.classList.add("is-dragging");
    piece.style.left = left + "px";
    piece.style.top = top + "px";
    await moveCursor(cursorX, cursorY, TIMING.BLOCK_DRAG);
    piece.classList.remove("is-dragging");
    await sleep(TIMING.INSERT_SETTLE);
  }

  async function playTutorial(run) {
    resetDemo(true);
    if (reduceMotion.matches) {
      gwa.style.left = "376.796px";
      gwa.style.top = "264.155px";
      il.style.left = "376.796px";
      il.style.top = "337.155px";
      demo.classList.add("has-top-piece", "has-bottom-piece", "is-complete");
      gwa.classList.add("is-complete");
      il.classList.add("is-complete");
      return;
    }

    while (run === tutorialRun && !overlay.hidden) {
      await sleep(TIMING.TUTORIAL_PRESENT);
      if (run !== tutorialRun || overlay.hidden) return;

      await dragBlock(gwa, 376.796, 264.155, 468, 352);
      demo.classList.add("has-top-piece");
      if (run !== tutorialRun || overlay.hidden) return;

      await moveCursor(183, 452, TIMING.CURSOR_MOVE);
      await dragBlock(il, 376.796, 337.155, 468, 425);
      demo.classList.add("has-bottom-piece");
      if (run !== tutorialRun || overlay.hidden) return;

      demo.classList.add("is-complete");
      gwa.classList.add("is-complete", "is-bouncing");
      await sleep(TIMING.COMPLETE_STAGGER);
      il.classList.add("is-complete", "is-bouncing");
      await sleep(TIMING.COMPLETE_HOLD);

      resetDemo(true);
      await sleep(TIMING.RESET_SETTLE + TIMING.LOOP_PAUSE);
    }
  }

  function openTutorial() {
    tutorialRun += 1;
    overlay.hidden = false;
    overlay.classList.remove("is-closing");
    startButton.disabled = false;
    playTutorial(tutorialRun);
  }

  async function showLevelTransition(level) {
    await window.RebutStepTransition.show(level);
  }

  async function closeTutorial() {
    if (startButton.disabled) return;
    startButton.disabled = true;
    startButton.classList.add("is-pressed");
    await sleep(TIMING.BUTTON_PRESS);
    startButton.classList.remove("is-pressed");
    tutorialRun += 1;
    overlay.classList.add("is-closing");
    await sleep(TIMING.POPUP_FADE_OUT);
    overlay.hidden = true;
    overlay.classList.remove("is-closing");
    await showLevelTransition(1);
    loadLevel(0);
    startButton.disabled = false;
  }

  window.addEventListener("message", (event) => {
    if (event.source !== frame.contentWindow) return;
    const data = event.data;
    if (!data || data.type !== "rebut-level-complete") return;
    scheduleNext(data);
  });

  document.querySelector("#tutorial-open").addEventListener("click", () => window.RebutBookTutorial.open());
  document.querySelector("#game-restart").addEventListener("click", () => loadLevel(currentLevel));
  document.querySelector("#game-back").addEventListener("click", () => {
    window.location.href = "../../?rehab=language";
  });
  startButton.addEventListener("click", closeTutorial);
  window.addEventListener("resize", fitApp);
  reduceMotion.addEventListener?.("change", () => {
    if (!overlay.hidden) openTutorial();
  });

  fitApp();
  if (query.get("tutorial") === "0") {
    overlay.hidden = true;
    void (async () => {
      await showLevelTransition(initialLevel + 1);
      loadLevel(initialLevel);
    })();
  } else {
    loadLevel(initialLevel);
    openTutorial();
  }
})();
</script>
</body>
