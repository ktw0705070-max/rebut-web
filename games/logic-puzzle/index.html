<!doctype html>
<html lang="ko">
<head>
    <script src="../shared/game-clock.js?v=20261020-book-popup"></script>
    <script src="../shared/book-tutorial.js?v=20261020-book-popup" defer></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf8">
  <title>REBUT — 논리 배치 퍼즐</title>
  <link rel="icon" href="assets/game-logo.png">
  <link rel="stylesheet" href="styles.css?v=20261020-logic-result">
  <link rel="stylesheet" href="game-menu.css?v=20261006-1">
  <script src="config.js" defer></script>
  <script src="tutorial-common.js" defer></script>
  <script src="result-data.js?v=20261020-book-popup" defer></script>
  <script src="logic-game.js?v=20261020-book-popup" defer></script>
  <script src="app.js?v=20261020-book-popup" defer></script>
  <script src="game-menu.js?v=20261020-logic-result" defer></script>
  <link rel="stylesheet" href="../shared/step-transition.css?v=20261011-shared-step-2">
  <script src="../shared/step-transition.js?v=20261011-shared-step"></script>
    <link rel="stylesheet" href="../shared/round-progress.css?v=20261020-compact-rounds" />
<script src="../shared/menu-prefetch.js?v=20261020-fast-entry" defer></script>
</head>
<body>
  <main class="viewport" aria-label="REBUT 판단력 게임">
    <section class="stage" id="game-stage" aria-label="논리 배치 퍼즐">
      <button class="chrome-control game-menu menu-control" type="button" aria-label="게임 메뉴 열기" aria-controls="game-menu" aria-expanded="false"><img src="../sequence-memory/assets/tutorial-menu.png" alt="" draggable="false"></button>

      <aside class="game-menu-layer" id="game-menu" aria-label="게임 메뉴" aria-hidden="true">
        <div class="game-menu-shield" aria-hidden="true"></div>
        <nav class="game-menu-panel" aria-labelledby="game-menu-title">
          <img class="game-menu-panel__background" src="assets/menu-background.png" alt="" draggable="false">

          <header class="game-menu-header">
            <h2 id="game-menu-title">게임 메뉴</h2>
            <button class="game-menu-close" type="button" aria-label="게임 메뉴 닫기"><img src="assets/menu-close.png" alt="" draggable="false"></button>
          </header>

          <div class="game-menu-categories">
            <section class="game-menu-category" data-menu-category="memory">
              <button class="game-menu-category__toggle" type="button" aria-expanded="false" aria-controls="memory-games">
                <span>기억력 게임</span>
                <img class="game-menu-arrow game-menu-arrow--closed" src="../sequence-memory/assets/menu-arrow-black-transparent.png" alt="">
                <img class="game-menu-arrow game-menu-arrow--open" src="../sequence-memory/assets/menu-arrow-white-transparent.png" alt="">
              </button>
              <div class="game-menu-games" id="memory-games" aria-hidden="true"><div class="game-menu-games__inner">
                <a class="game-menu-game" href="../sequence-memory/index.html">순서 암기</a>
                <a class="game-menu-game" href="../missing-number/index.html">없는 숫자 찾기</a>
                <a class="game-menu-game" href="../keyword-restore/index.html">키워드 복원</a>
              </div></div>
            </section>

            <section class="game-menu-category" data-menu-category="judgment">
              <button class="game-menu-category__toggle" type="button" aria-expanded="false" aria-controls="judgment-games">
                <span>판단력 게임</span>
                <img class="game-menu-arrow game-menu-arrow--closed" src="../sequence-memory/assets/menu-arrow-black-transparent.png" alt="">
                <img class="game-menu-arrow game-menu-arrow--open" src="../sequence-memory/assets/menu-arrow-white-transparent.png" alt="">
              </button>
              <div class="game-menu-games" id="judgment-games" aria-hidden="true"><div class="game-menu-games__inner">
                <a class="game-menu-game" href="../hidden-weight/index.html">숨은 무게 찾기</a>
                <button class="game-menu-game is-current" type="button" aria-current="page" data-current-game>논리 배치 퍼즐</button>
                <a class="game-menu-game" href="../bias-sentence/index.html">편향 문장 판정</a>
              </div></div>
            </section>

            <section class="game-menu-category" data-menu-category="language">
              <button class="game-menu-category__toggle" type="button" aria-expanded="false" aria-controls="language-games">
                <span>언어력 게임</span>
                <img class="game-menu-arrow game-menu-arrow--closed" src="../sequence-memory/assets/menu-arrow-black-transparent.png" alt="">
                <img class="game-menu-arrow game-menu-arrow--open" src="../sequence-memory/assets/menu-arrow-white-transparent.png" alt="">
              </button>
              <div class="game-menu-games" id="language-games" aria-hidden="true"><div class="game-menu-games__inner">
                <a class="game-menu-game" href="../sentence-order/index.html">문장 인과 순서 배치</a>
                <a class="game-menu-game" href="../awkward-sentence/index.html">어색한 문장 찾기</a>
                <a class="game-menu-game" href="../word-block/index.html?v=20260927-menu-click-fix">단어 블록 맞추기</a>
              </div></div>
            </section>
          </div>
        </nav>
      </aside>

      <button class="chrome-control game-back" type="button" aria-label="메인 화면으로 돌아가기"><img src="../sequence-memory/assets/tutorial-back.png" alt="" draggable="false"></button>

      <section class="game-screen" id="game-screen" inert>
        <header class="game-chrome">
          <!-- 순서 암기 튜토리얼의 원본 로고, 진행 표시, 책, 새로고침 에셋. -->
          <div class="game-logo" role="img" aria-label="REBUT">
            <img src="../sequence-memory/assets/game-logo-r.png" alt="" draggable="false">
            <img src="../sequence-memory/assets/game-logo-e.png" alt="" draggable="false">
            <img src="../sequence-memory/assets/game-logo-b.png" alt="" draggable="false">
            <img src="../sequence-memory/assets/game-logo-u.png" alt="" draggable="false">
            <img src="../sequence-memory/assets/game-logo-t.png" alt="" draggable="false">
          </div>
          <div class="round-progress" role="img" aria-label="1-1" aria-live="polite">
            <img id="level-progress-digit" src="assets/round-digit-1.png" alt="" draggable="false">
            <span class="round-progress__dash" aria-hidden="true"></span>
            <img id="round-progress-digit" class="round-progress__current" src="assets/round-digit-1.png" alt="" draggable="false">
          </div>
          <button class="chrome-control game-book" type="button" aria-label="튜토리얼 다시 보기"><img src="../sequence-memory/assets/tutorial-book.png" alt="" draggable="false"></button>
          <button class="chrome-control game-restart" type="button" aria-label="다시 시작"><img src="../sequence-memory/assets/tutorial-exit.png" alt="" draggable="false"></button>
        </header>
        <div class="game-board">
        <div class="game-conditions" id="game-conditions"></div>
        <p class="game-direction">(큰 순서대로 왼→오)</p>
        <div id="game-slots" class="game-slots" aria-label="카드를 큰 순서대로 배치할 자리"></div>
        <div id="game-cards" class="game-cards"></div>
        </div>
        <p class="sr-only" id="game-status" role="status"></p>
      </section>
      <!-- 기존 편향 문장 판정의 overlay → dim-layer + tutorial-panel 구조. -->
      <div id="tutorial-overlay" class="tutorial-overlay">
        <div class="dim-layer" aria-hidden="true"></div>
        <article id="tutorial-panel" class="tutorial-panel" role="dialog" aria-modal="true" aria-labelledby="tutorial-title" aria-describedby="tutorial-instructions">
          <img class="popup-frame" src="../sequence-memory/assets/popup-frame.png" alt="" draggable="false">
          <h1 id="tutorial-title" class="tutorial-title">논리 배치 퍼즐</h1>
          <div class="tutorial-condition" id="tutorial-condition"></div>
          <p class="tutorial-direction">(큰 순서대로 왼→오)</p>
          <div id="tutorial-demo" class="tutorial-demo" role="img" aria-label="A는 B보다 크므로 A, B 순서로 배치하는 자동 시연">
            <div id="tutorial-slots"></div>
            <div id="tutorial-cards"></div>
            <div class="tutorial-cursor" aria-hidden="true"><span class="cursor-art"></span></div>
          </div>
          <p id="tutorial-instructions" class="tutorial-instructions"><span>먼저, 문장이 알려주는 관계를 살펴보세요.</span><span>그다음, 가장 큰 것부터 순서대로 배치하세요.</span></p>
          <button id="tutorial-start" class="tutorial-start" type="button"><img src="assets/tutorial-button.png" alt="" draggable="false"><span>시작하기</span></button>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
