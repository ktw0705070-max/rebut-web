        const DESIGN_WIDTH = 1920;
        const DESIGN_HEIGHT = 1080;
        const root = document.documentElement;

        const updateStageScale = () => {
          const width = document.documentElement.clientWidth;
          const height = window.visualViewport?.height || window.innerHeight;
          const portrait = width / height < 0.8;
          const fillScale = Math.max(width / DESIGN_WIDTH, height / DESIGN_HEIGHT);
          const visibleDesignWidth = width / fillScale;
          const visibleDesignHeight = height / fillScale;
          const sideInset = Math.max(0, (DESIGN_WIDTH - visibleDesignWidth) / 2);
          const topInset = Math.max(0, (DESIGN_HEIGHT - visibleDesignHeight) / 2);
          const scale = portrait
            ? height / DESIGN_HEIGHT
            : fillScale;

          root.style.setProperty("--stage-scale", scale.toFixed(6));
          root.style.setProperty("--side-inset", portrait ? "0px" : `${sideInset.toFixed(3)}px`);
          root.style.setProperty("--stage-top-inset", `${topInset.toFixed(3)}px`);

          // Match the gameplay back control, despite the menu's cover-scaled stage.
          const gameScale = Math.min(width / DESIGN_WIDTH, height / DESIGN_HEIGHT);
          const stageLeft = (width - DESIGN_WIDTH * scale) / 2;
          const stageTop = (height - DESIGN_HEIGHT * scale) / 2;
          const backLeft = (width - DESIGN_WIDTH * gameScale) / 2 + 59.45 * gameScale;
          const backTop = height - (DESIGN_HEIGHT - 977.87) * gameScale;
          root.style.setProperty("--rehab-back-left", `${(backLeft - stageLeft) / scale}px`);
          root.style.setProperty("--rehab-back-top", `${(backTop - stageTop) / scale}px`);
          root.style.setProperty("--rehab-back-scale", gameScale / scale);
        };

          },
        };
        let activeRehab = null;

        const openRehab = (type, { focusNav = true } = {}) => {
          const menu = rehabMenus[type];
          if (!menu) return;

          rehabTitle.src = menu.titleImage;
          rehabTitle.alt = menu.titleAlt;
          rehabTitle.style.setProperty("--rehab-title-width", `${menu.titleWidth}px`);
          rehabTitle.style.setProperty("--rehab-title-height", `${menu.titleHeight}px`);
          rehabGames.forEach((label, index) => {
            label.textContent = menu.games[index];
          });
          rehabSlots.forEach((slot, index) => {
            const route = menu.routes[index];
            if (route) {
              slot.dataset.gameLink = new URL(route, window.location.href).href;
              slot.setAttribute("role", "link");
              slot.setAttribute("tabindex", "0");
              slot.setAttribute("aria-label", `${menu.games[index]} 튜토리얼 열기`);
            } else {
              delete slot.dataset.gameLink;
              slot.removeAttribute("role");
              slot.removeAttribute("tabindex");
              slot.removeAttribute("aria-label");
            }
          });

          Object.values(rehabMenus).forEach(({ nav }) => {
            const current = nav === menu.nav;
            nav.setAttribute("aria-expanded", String(current));
            nav.classList.toggle("is-current", current);
          });
          homeButtons.forEach((button) => {
            button.setAttribute("aria-expanded", "true");
          });

          memoryScreen.inert = false;
          siteHeader.inert = false;
          memoryScreen.setAttribute("aria-hidden", "false");
          activeRehab = type;

          if (!document.body.classList.contains("memory-open")) {
            document.body.classList.add("memory-open");
          } else {
            memoryScreen.querySelectorAll(".memory-card").forEach((card) => {
              card.getAnimations().forEach((animation) => {
                animation.cancel();
                animation.play();
              });
            });
          }
          if (focusNav) menu.nav.focus();
          mainCenter.inert = true;
          mainCenter.setAttribute("aria-hidden", "true");
        };

        const closeRehab = () => {
          if (!document.body.classList.contains("memory-open")) return;
          const focusTarget = homeButtons.find((button) => button.dataset.homeRehab === activeRehab) || homeButtons[0];
          document.body.classList.remove("memory-open");
          mainCenter.inert = false;
          mainCenter.removeAttribute("aria-hidden");
          siteHeader.inert = true;
          memoryScreen.inert = true;
          memoryScreen.setAttribute("aria-hidden", "true");
          Object.values(rehabMenus).forEach(({ nav }) => {
            nav.setAttribute("aria-expanded", "false");
            nav.classList.remove("is-current");
          });
          homeButtons.forEach((button) => button.setAttribute("aria-expanded", "false"));
          activeRehab = null;
          focusTarget.focus();
        };

        memoryNav.addEventListener("click", () => openRehab("memory"));
        judgmentNav.addEventListener("click", () => openRehab("judgment"));
        languageNav.addEventListener("click", () => openRehab("language"));
        homeButtons.forEach((button) => {
          button.addEventListener("click", () => openRehab(button.dataset.homeRehab));
        });
        memoryScreen.addEventListener("click", (event) => {
          const slot = event.target.closest("[data-game-link]");
          if (slot) window.location.href = slot.dataset.gameLink;
        });
        memoryScreen.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          const slot = event.target.closest("[data-game-link]");
          if (!slot) return;
          event.preventDefault();
          window.location.href = slot.dataset.gameLink;
        });
        memoryBack.addEventListener("click", closeRehab);
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") closeRehab();
        });

        const pageUrl = new URL(window.location.href);
        const requestedRehab = pageUrl.searchParams.get("rehab");
        const navigationType = window.performance?.getEntriesByType?.("navigation")?.[0]?.type;

        // A game return opens its category; a refresh starts the home intro again.
        if (navigationType === "reload" && pageUrl.searchParams.has("rehab")) {
          pageUrl.searchParams.delete("rehab");
          window.history.replaceState(window.history.state, "", pageUrl.href);
        } else if (rehabMenus[requestedRehab]) {
          openRehab(requestedRehab, { focusNav: false });
        }
      })();
    </script>
    <script src="./rebut-motion.js?v=4"></script>
  </body>
</html>
